{% set name = "scheil" %}
{% set version = "0.3.0" %}
{% set sha256 = "f029d19f22c073f47440189c335f4fd9dd3fc6eb8a00acf726d80d7b9da14e1a" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - importlib_metadata
    - numpy
    - scipy
    - setuptools_scm >=6.0
    - pycalphad >=0.9.1

test:
  requires:
    - python {{ python_min }}
  imports:
    - scheil
    - scheil.simulate
    - scheil.solidification_result
    - scheil.utils

about:
  home: https://scheil.readthedocs.io
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A Scheil-Gulliver simulation tool using pycalphad
  doc_url: A Scheil-Gulliver simulation tool using pycalphad
  dev_url: https://github.com/pycalphad/scheil

extra:
  recipe-maintainers:
    - bocklund
    - richardotis
